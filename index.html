<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Для Даши ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Manrope', sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 20% 10%, rgba(120, 25, 55, 0.35), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(90, 20, 45, 0.3), transparent 35%),
        #100b0e;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04), transparent 30%);
}

body::after {
    content: "";
    position: fixed;
    width: 380px;
    height: 380px;
    right: -80px;
    top: -80px;
    border-radius: 50%;
    background: rgba(214, 107, 139, 0.08);
    filter: blur(30px);
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px 18px 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    background: rgba(29, 20, 24, 0.88);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 30px;
    padding: 28px 22px 24px;
    box-shadow:
        0 25px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent 40%, transparent 60%, rgba(255,255,255,0.02));
    pointer-events: none;
}

.top {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
}

.eyebrow {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #c99aa9;
    margin-bottom: 9px;
}

.title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    line-height: 1.15;
    margin: 0;
    font-weight: 500;
    letter-spacing: 0.2px;
}

.subtitle {
    margin-top: 9px;
    font-size: 13px;
    color: #aa9ba0;
}

.progress-wrap {
    margin: 22px 0 28px;
    position: relative;
    z-index: 1;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #9d8d93;
    margin-bottom: 9px;
}

.progress {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, #8c2949, #d66b8b);
    box-shadow: 0 0 18px rgba(214, 107, 139, 0.45);
    transition: width 0.5s ease;
}

.question {
    animation: questionIn 0.45s ease;
    position: relative;
    z-index: 1;
}

@keyframes questionIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.question-number {
    font-size: 12px;
    color: #b86682;
    margin-bottom: 10px;
    font-weight: 700;
}

.question-text {
    font-family: 'Playfair Display', serif;
    font-size: 25px;
    line-height: 1.25;
    margin-bottom: 24px;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.answer {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 17px;
    background: rgba(255,255,255,0.045);
    color: #eee7e9;
    padding: 15px 16px;
    text-align: left;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
    transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
}

.answer:active {
    transform: scale(0.98);
}

.answer:hover {
    background: rgba(255,255,255,0.075);
    border-color: rgba(214,107,139,0.35);
    box-shadow: inset 0 0 0 1px rgba(214,107,139,0.18);
    transform: translateY(-1px);
}

.answer-letter {
    display: inline-flex;
    width: 27px;
    height: 27px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(185,74,107,0.14);
    color: #d9859e;
    font-size: 12px;
    font-weight: 700;
    margin-right: 9px;
    vertical-align: middle;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 120px);
    width: calc(100% - 36px);
    max-width: 460px;
    padding: 15px 18px;
    border-radius: 17px;
    background: rgba(37, 25, 30, 0.97);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    text-align: center;
    font-size: 14px;
    line-height: 1.4;
    z-index: 100;
    transition: transform 0.35s ease;
}

.toast.show {
    transform: translate(-50%, 0);
}

.final {
    text-align: center;
    animation: finalIn 0.7s ease;
    position: relative;
    z-index: 1;
}

@keyframes finalIn {
    from {
        opacity: 0;
        transform: scale(0.96) translateY(10px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.final-heart {
    font-size: 64px;
    margin-bottom: 14px;
    animation: heartbeat 1.7s infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    12% {
        transform: scale(1.12);
    }

    24% {
        transform: scale(1);
    }

    36% {
        transform: scale(1.08);
    }
}

.final-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    margin-bottom: 20px;
}

.final-text {
    font-size: 15px;
    line-height: 1.75;
    color: #d7cdd0;
}

.final-text strong {
    color: #fff;
}

.hidden {
    display: none;
}

@media (max-width: 400px) {

    .container {
        padding: 15px 12px;
    }

    .card {
        padding: 24px 17px 20px;
        border-radius: 25px;
    }

    .title {
        font-size: 27px;
    }

    .question-text {
        font-size: 23px;
    }
}
</style>
</head>

<div class="container">

</div>

<div

</div>

            { text: "🙂 Есть немного", reaction: "Немного — это уже достаточно, чтобы начать что-нибудь с этим делать 😏" },
            { text: "✨ Было бы славно", reaction: "Хмм… кажется, я знаю, как можно было бы исправить ситуацию 😌" },
            { text: "🔥 Очень хочется", reaction: "Так. А вот теперь мне точно нужно оказаться рядом с тобой 😏❤️" }
        ]
    }

];

let currentQuestion = 0;
let userAnswers = [];

const questionContainer = document.getElementById("questionContainer");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const progressPercent = document.getElementById("progressPercent");
const toast = document.getElementById("toast");

function sanitizeText(value) {
    return String(value || '')
        .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '')
        .replace(/\s+/g, ' ')
        .trim();
}

function makeAnswerText() {
    return userAnswers
        .map((item, index) => `${index + 1}. ${sanitizeText(item.question)} — ${sanitizeText(item.answer)}`)
        .join('\n');
}

function renderQuestion() {
    const question = questions[currentQuestion];
    const number = currentQuestion + 1;
    const total = questions.length;
    const percent = Math.round((number / total) * 100);

    progressText.textContent = `Вопрос ${number} из ${total}`;
    progressPercent.textContent = `${percent}%`;
    progressBar.style.width = `${percent}%`;

    questionContainer.innerHTML = `
        <div class="question">
            <div class="question-number">${String(number).padStart(2, "0")}</div>
            <div class="question-text">${question.text}</div>
            <div class="answers">
                ${question.answers.map((answer, index) => `
                    <button class="answer" onclick="selectAnswer(${index})">
                        <span class="answer-letter">${String.fromCharCode(65 + index)}</span>
                        ${answer.text}
                    </button>
                `).join("")}
            </div>
        </div>
    `;
}

function selectAnswer(index) {
    const question = questions[currentQuestion];
    const selectedAnswer = question.answers[index];

    userAnswers.push({
        question: sanitizeText(question.text),
        answer: sanitizeText(selectedAnswer.text)
    });

    showToast(selectedAnswer.reaction);

    setTimeout(() => {
        currentQuestion++;

        if (currentQuestion < questions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }, 1800);
}

function finishQuiz() {
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");

    const payload = {
        summary: "❤️ Даша прошла тест!",
        answers: userAnswers,
        answersText: makeAnswerText()
    };

    fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    }).catch(() => {
        console.log('Результаты теста отправлены');
    });
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1600);
}

renderQuestion();

</script>
